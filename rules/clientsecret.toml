# NOTE: this file is now fully redundant with client_secret.toml's fixed
# "client[_\s-]?secret" pattern, which already matches the no-separator form
# ("clientsecret") too. Safe to delete this file entirely; kept here only so
# every original filename still gets a fix. See audit notes from Claude.
[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "ClientSecret Keyword Match"
Description = "Detect 'clientsecret' (no separator) — duplicate coverage of client_secret.toml, kept for compatibility"
MatchAction = "Snaffle"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = [
    "client[_\\s-]?secret",
]
CaseSensitive = false
Triage = "Red"
