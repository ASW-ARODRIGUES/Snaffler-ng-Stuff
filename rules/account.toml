[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "Account Field Match"
Description = "Detect 'account' used as a field name with a value, not the bare word (which matches 'accountant', 'accounting', login-page boilerplate, cookie banners, etc.)"
MatchAction = "Snaffle"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = [
    "(?i)\\baccount\\b\\s*[:=]\\s*\\S+",
]
CaseSensitive = false
Triage = "Yellow"
