[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "User Field Match"
Description = "Detect '/user' as an actual field reference with a value, not any URL path segment or word containing 'user' (users, username, etc.)"
MatchAction = "Snaffle"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = [
    "(?i)/user(?:name)?\\s*[:=]\\s*\\S+",
]
CaseSensitive = false
Triage = "Yellow"
