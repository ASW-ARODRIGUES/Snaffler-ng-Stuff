[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "Client Secret Keyword Match"
Description = "Detect 'client secret' / 'client_secret' with a bounded gap, not an unbounded '.*' that can span an entire file"
MatchAction = "Snaffle"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = [
    "client[_\\s-]?secret",
]
CaseSensitive = false
Triage = "Red"
