[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "GHP Token Match"
Description = "Detect an actual GitHub personal access token (ghp_ + 36 chars), not just the substring 'ghp'"
MatchAction = "Snaffle"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = [
    "ghp_[A-Za-z0-9]{36}",
]
CaseSensitive = false
Triage = "Red"
