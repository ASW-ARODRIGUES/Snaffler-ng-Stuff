[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "U Flag Match"
Description = "Detect a '-U <username>'-style flag (sqlcmd/psql/mysql connection strings), not just any '-U' substring"
MatchAction = "Snaffle"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = [
    "(?:^|\\s)-U\\s+\\S+",
]
CaseSensitive = false
Triage = "Red"
