[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "PEM Header Match"
Description = "Detect an actual PEM-encoded key/cert block, not just the substring 'pem' (matches 'system', 'modem', 'open', etc.)"
MatchAction = "Snaffle"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = [
    "-----BEGIN [A-Z0-9 ]*(PRIVATE KEY|CERTIFICATE|PUBLIC KEY)-----",
]
CaseSensitive = false
Triage = "Red"
