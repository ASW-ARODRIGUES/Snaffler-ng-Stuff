[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "Secret Field Match"
Description = "Detect 'secret' used as a field name with a value, not the bare word (which matches 'secretary', 'secretariat', generic prose)"
MatchAction = "Snaffle"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = [
    "(?i)\\bsecret\\b\\s*[:=]\\s*\\S+",
]
CaseSensitive = false
Triage = "Red"
