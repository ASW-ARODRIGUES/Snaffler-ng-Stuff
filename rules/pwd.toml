[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "PWD Field Match"
Description = "Detect 'pwd' used as a field name (pwd: / pwd=), not the bare substring (which matches 'pwdump' tool names, cwd references, etc. with no signal)"
MatchAction = "Snaffle"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = [
    "(?i)\\bpwd\\b\\s*[:=]",
]
CaseSensitive = false
Triage = "Red"
