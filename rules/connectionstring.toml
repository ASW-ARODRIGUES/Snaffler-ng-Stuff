[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "Connection String Keyword Match"
Description = "Detect 'connection string' / 'connectionstring' / 'connection_string', not just the no-space form"
MatchAction = "Snaffle"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = [
    "connection[_\\s]?string",
]
CaseSensitive = false
Triage = "Red"
