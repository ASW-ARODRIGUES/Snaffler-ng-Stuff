[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "CREATE LOGIN Keyword Match"
Description = "Detect the actual SQL 'CREATE LOGIN' statement, not an unbounded '.*' that can span an entire file"
MatchAction = "Snaffle"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = [
    "CREATE\\s+LOGIN\\b",
]
CaseSensitive = false
Triage = "Red"
