[[ClassifierRules]]
EnumerationScope = "FileEnumeration"
RuleName = "PPK File Match"
Description = "Detect PuTTY private key files by extension, not the content substring 'ppk' (which matches constantly in binary noise)"
MatchAction = "Snaffle"
MatchLocation = "FileExtension"
WordListType = "Exact"
WordList = [
    ".ppk",
]
Triage = "Red"
