[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "PW Flag Match"
Description = "Detect a '-pw <value>'-style flag, not just the bare '-pw' substring"
MatchAction = "Snaffle"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = [
    "(?:^|\\s)-pw\\s+\\S+",
]
CaseSensitive = false
Triage = "Red"
