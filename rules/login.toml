[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "Login Field Match"
Description = "Detect 'login' used as a field name with a value, not the bare word (which matches login-page UI text, log filenames, generic prose)"
MatchAction = "Snaffle"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = [
    "(?i)\\blogin\\b\\s*[:=]\\s*\\S+",
]
CaseSensitive = false
Triage = "Red"
