[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "IDENTIFIED BY Keyword Match"
Description = "Detect the actual SQL 'IDENTIFIED BY' clause, not an unbounded '.*' that can span an entire file"
MatchAction = "Snaffle"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = [
    "IDENTIFIED\\s+BY\\b",
]
CaseSensitive = false
Triage = "Red"
