[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "Handover Credential Context"
Description = "Detect 'handover' only near actual credential indicators, not any document that merely mentions handing something over"
MatchAction = "Snaffle"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = [
    "(?i)\\bhandover\\b.{0,80}\\b(password|passwd|pwd|secret|credential|login|username)\\b",
    "(?i)\\b(password|passwd|pwd|secret|credential|login|username)\\b.{0,80}\\bhandover\\b",
]
CaseSensitive = false
Triage = "Yellow"
