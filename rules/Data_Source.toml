[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "Data Source Keyword Match"
Description = "Detect the actual ADO/ODBC 'Data Source=' connection-string key, not an unbounded '.*' that can span an entire file"
MatchAction = "Snaffle"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = [
    "Data\\s*Source\\s*=",
]
CaseSensitive = false
Triage = "Red"
